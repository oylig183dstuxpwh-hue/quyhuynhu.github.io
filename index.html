<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baccarat Live Predictor — Claymorphism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  :root{
    --ink:#3F3826;
    --ink-soft:#6F6650;
    --ink-faint:#948A70;

    --bg:#E6E4D3;
    --bg-deep:#DBD8C3;
    --panel:#EDEBDB;
    --panel-deep:#E2DFCB;
    --well:#DEDBC6;

    --gold:#C6963E;
    --gold-deep:#A9782B;
    --gold-soft:#EAD9AC;

    --banker:#CF6A4C;
    --banker-deep:#AE4F35;
    --banker-tint:#F3D2C4;

    --player:#5679AC;
    --player-deep:#3E5C8A;
    --player-tint:#CBDAEE;

    --tie:#4E9070;
    --tie-deep:#357155;
    --tie-tint:#C9E2D3;

    --good:#5B9A5E;
    --good-deep:#3F7B44;
    --bad:#C1573F;
    --bad-deep:#9E3F2C;

    --sh-lig: rgba(255,255,255,0.75);
    --sh-dar: rgba(129,120,88,0.35);
    --sh-dar-soft: rgba(129,120,88,0.22);

    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 14px;
    --radius-xs: 10px;

    --font-display:'Baloo 2', 'Nunito', sans-serif;
    --font-body:'Nunito', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    position: relative;
    background-image:
      radial-gradient(ellipse 60% 40% at 12% 8%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(ellipse 50% 35% at 90% 92%, rgba(0,0,0,0.04), transparent 60%);
  }

  ::selection { background: var(--gold-soft); color: var(--ink); }

  /* ============================================
     DECORATIVE CLAY BLOBS
     ============================================ */
  .clay-blob {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
    opacity: 0.55;
    animation: blobfloat 26s ease-in-out infinite;
  }
  .clay-blob.b1 {
    width: 340px; height: 340px;
    top: -80px; left: -100px;
    background: linear-gradient(145deg, var(--gold-soft), var(--bg-deep));
    animation-delay: 0s;
  }
  .clay-blob.b2 {
    width: 420px; height: 420px;
    bottom: -140px; right: -130px;
    background: linear-gradient(145deg, var(--player-tint), var(--bg-deep));
    animation-delay: -9s;
  }
  .clay-blob.b3 {
    width: 260px; height: 260px;
    top: 46%; left: 96%;
    background: linear-gradient(145deg, var(--tie-tint), var(--bg-deep));
    animation-delay: -17s;
  }
  @keyframes blobfloat {
    0%, 100% { transform: translate(0,0) rotate(0deg) scale(1); }
    33% { transform: translate(24px,-18px) rotate(8deg) scale(1.04); }
    66% { transform: translate(-18px,20px) rotate(-6deg) scale(0.97); }
  }
  @media (prefers-reduced-motion: reduce) {
    .clay-blob { animation: none; }
  }

  .app {
    position: relative;
    z-index: 1;
    padding: 28px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ============================================
     CLAY PANEL — base "glass" class, now clay
     ============================================ */
  .glass {
    background: linear-gradient(160deg, var(--panel), var(--panel-deep));
    border-radius: var(--radius-lg);
    border: none;
    box-shadow:
      10px 10px 22px var(--sh-dar),
      -9px -9px 18px var(--sh-lig);
    position: relative;
    overflow: hidden;
  }
  .glass::before { content: none; }

  /* ============================================
     HEADER
     ============================================ */
  .header-panel {
    padding: 26px 30px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: var(--font-display);
    color: var(--gold-deep);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .settings-row {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .settings-row label {
    font-size: 13.5px;
    color: var(--ink);
    font-weight: 700;
  }
  .glass-input {
    padding: 9px 14px;
    background: var(--well);
    color: var(--ink);
    border: none;
    border-radius: var(--radius-xs);
    width: 84px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--font-body);
    outline: none;
    box-shadow: inset 3px 3px 7px var(--sh-dar), inset -3px -3px 7px var(--sh-lig);
    transition: box-shadow 0.2s;
  }
  .glass-input:focus-visible {
    box-shadow: inset 3px 3px 7px var(--sh-dar), inset -3px -3px 7px var(--sh-lig), 0 0 0 3px var(--gold-soft);
  }
  .hotkeys {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-top: 8px;
    font-weight: 600;
  }
  .hotkeys kbd {
    background: var(--panel);
    color: var(--ink);
    padding: 4px 9px;
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    font-weight: 700;
    margin: 0 2px;
    box-shadow: 3px 3px 6px var(--sh-dar-soft), -2px -2px 5px var(--sh-lig);
  }

  /* ============================================
     INPUT ROW — B/P/T buttons
     ============================================ */
  .input-panel {
    padding: 20px 22px;
    margin-bottom: 18px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    padding: 16px 32px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    color: #fff9ee;
    position: relative;
    overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    text-shadow: 0 1px 1px rgba(0,0,0,0.18);
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 6%; left: 8%; right: 8%;
    height: 34%;
    border-radius: 50% 50% 60% 60% / 100% 100% 40% 40%;
    background: rgba(255,255,255,0.28);
    pointer-events: none;
  }
  .btn:active { transform: translateY(2px) scale(0.98); }
  .btnB {
    background: linear-gradient(155deg, #DE7C5C, var(--banker) 55%, var(--banker-deep));
    box-shadow: 7px 7px 15px rgba(174,79,53,0.4), -6px -6px 13px rgba(255,220,205,0.7);
  }
  .btnP {
    background: linear-gradient(155deg, #6C8FC4, var(--player) 55%, var(--player-deep));
    box-shadow: 7px 7px 15px rgba(62,92,138,0.4), -6px -6px 13px rgba(210,226,245,0.7);
  }
  .btnT {
    background: linear-gradient(155deg, #5FA582, var(--tie) 55%, var(--tie-deep));
    box-shadow: 7px 7px 15px rgba(53,113,85,0.4), -6px -6px 13px rgba(202,235,216,0.7);
  }
  .btn:hover { transform: translateY(-2px); }
  .btnB:hover { box-shadow: 9px 9px 18px rgba(174,79,53,0.42), -7px -7px 15px rgba(255,220,205,0.75); }
  .btnP:hover { box-shadow: 9px 9px 18px rgba(62,92,138,0.42), -7px -7px 15px rgba(210,226,245,0.75); }
  .btnT:hover { box-shadow: 9px 9px 18px rgba(53,113,85,0.42), -7px -7px 15px rgba(202,235,216,0.75); }
  .btn .key {
    font-family: var(--font-body);
    font-size: 11px;
    opacity: 0.85;
    margin-left: 8px;
    font-weight: 700;
  }

  .btnSm {
    padding: 11px 20px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--font-body);
    background: var(--panel);
    color: var(--ink);
    border: none;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 5px 5px 11px var(--sh-dar), -5px -5px 11px var(--sh-lig);
  }
  .btnSm:hover { transform: translateY(-1px); }
  .btnSm:active { transform: translateY(1px); box-shadow: inset 3px 3px 7px var(--sh-dar), inset -3px -3px 7px var(--sh-lig); }
  .btnWarn {
    background: linear-gradient(155deg, #E4B15C, var(--gold)) !important;
    color: #3a2c0f !important;
    font-weight: 800;
    box-shadow: 5px 5px 11px rgba(169,120,43,0.4), -5px -5px 11px rgba(255,238,200,0.7) !important;
  }
  .btnOk {
    background: linear-gradient(155deg, #7DB97F, var(--good)) !important;
    color: #fff !important;
    font-weight: 800;
    box-shadow: 5px 5px 11px rgba(63,123,68,0.4), -5px -5px 11px rgba(210,240,210,0.7) !important;
  }
  .btnNo {
    background: linear-gradient(155deg, #DA7963, var(--bad)) !important;
    color: #fff !important;
    font-weight: 800;
    box-shadow: 5px 5px 11px rgba(158,63,44,0.4), -5px -5px 11px rgba(250,215,205,0.7) !important;
  }

  /* ============================================
     TOOLBAR
     ============================================ */
  .toolbar {
    padding: 14px 20px;
    margin-bottom: 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ============================================
     HISTORY CHIPS
     ============================================ */
  .history {
    padding: 16px;
    margin-bottom: 20px;
    min-height: 54px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .h-chip {
    width: 36px; height: 36px;
    border-radius: var(--radius-xs);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: #fffaf0;
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
  }
  .h-B { background: linear-gradient(155deg, #DE7C5C, var(--banker-deep)); box-shadow: 4px 4px 9px rgba(174,79,53,0.4), -3px -3px 7px rgba(255,220,205,0.65); }
  .h-P { background: linear-gradient(155deg, #6C8FC4, var(--player-deep)); box-shadow: 4px 4px 9px rgba(62,92,138,0.4), -3px -3px 7px rgba(210,226,245,0.65); }
  .h-T { background: linear-gradient(155deg, #5FA582, var(--tie-deep)); box-shadow: 4px 4px 9px rgba(53,113,85,0.4), -3px -3px 7px rgba(202,235,216,0.65); }
  .h-chip.mark-ok { outline: 3px solid var(--good); outline-offset: 1.5px; }
  .h-chip.mark-no { outline: 3px solid var(--gold); outline-offset: 1.5px; }

  /* ============================================
     RESULT PANEL
     ============================================ */
  .result {
    padding: 28px 30px;
    margin-bottom: 20px;
  }
  .prediction {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 2px;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .B { color: var(--banker-deep); }
  .P { color: var(--player-deep); }
  .N { color: var(--ink-faint); }
  .conf {
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .gate {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: var(--gold-deep);
    font-weight: 700;
  }

  .feedback-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .feedback-row button {
    padding: 13px 28px;
    font-size: 15px;
    font-family: var(--font-body);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-weight: 800;
    transition: transform 0.12s;
  }
  .feedback-row button:active { transform: translateY(2px) scale(0.97); }

  /* ============================================
     STRATEGY TABLE
     ============================================ */
  h2 {
    font-family: var(--font-display);
    color: var(--gold-deep);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 24px 0 12px;
  }
  table.strat, table.perf {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 6px;
    margin-top: 6px;
  }
  table.strat th, table.perf th {
    color: var(--ink-soft);
    font-weight: 800;
    font-size: 11.5px;
    text-align: left;
    padding: 0 14px 6px;
    letter-spacing: 0.3px;
  }
  table.strat td, table.perf td {
    padding: 11px 14px;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    background: var(--panel);
    box-shadow: inset 2px 2px 5px var(--sh-dar-soft), inset -2px -2px 5px var(--sh-lig);
  }
  table.strat tr td:first-child, table.perf tr td:first-child { border-radius: var(--radius-xs) 0 0 var(--radius-xs); font-weight: 800; }
  table.strat tr td:last-child, table.perf tr td:last-child { border-radius: 0 var(--radius-xs) var(--radius-xs) 0; }
  td.B { color: var(--banker-deep); font-weight: 800; }
  td.P { color: var(--player-deep); font-weight: 800; }
  td.N { color: var(--ink-faint); font-weight: 700; }
  .w-input {
    width: 58px;
    padding: 6px 8px;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-body);
    background: var(--well);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    text-align: center;
    outline: none;
    box-shadow: inset 2px 2px 5px var(--sh-dar), inset -2px -2px 5px var(--sh-lig);
  }
  .w-input:focus-visible { box-shadow: inset 2px 2px 5px var(--sh-dar), inset -2px -2px 5px var(--sh-lig), 0 0 0 3px var(--gold-soft); }

  /* ============================================
     STAT CARDS
     ============================================ */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .stat-card {
    background: linear-gradient(160deg, var(--panel), var(--panel-deep));
    padding: 18px;
    border-radius: var(--radius-sm);
    box-shadow: 7px 7px 15px var(--sh-dar), -6px -6px 13px var(--sh-lig);
    transition: transform 0.2s ease;
    position: relative;
  }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-card .label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.6px;
    font-weight: 800;
  }
  .stat-card .value {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    color: var(--gold-deep);
    font-variant-numeric: tabular-nums;
  }
  .stat-card .sub {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 5px;
    font-weight: 700;
  }

  /* ============================================
     PERF TABLE extras
     ============================================ */
  table.perf { font-size: 12px; }
  table.perf .num { text-align: right; font-variant-numeric: tabular-nums; }
  .hr-bar {
    display: inline-block;
    height: 7px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--gold), var(--good));
    vertical-align: middle;
    margin-left: 6px;
    box-shadow: 1px 1px 3px var(--sh-dar-soft);
  }

  /* ============================================
     ROADS PANEL — clay recessed well
     ============================================ */
  .roads-panel {
    margin-top: 20px;
    padding: 18px;
    overflow: hidden;
  }
  .roads-grid-ref {
    display: grid;
    grid-template-columns: 6fr 4fr;
    gap: 10px;
  }
  .road-panel {
    display: flex;
    background: var(--well);
    border-radius: var(--radius-sm);
    box-shadow: inset 3px 3px 7px var(--sh-dar), inset -3px -3px 7px var(--sh-lig);
    min-height: 110px;
    position: relative;
    overflow: hidden;
  }
  .road-panel.empty { background: transparent; box-shadow: none; }
  .road-label-v {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-orientation: mixed;
    color: var(--ink-soft);
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    padding: 8px 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 26px;
    flex-shrink: 0;
  }
  .leading-tie-badge {
    writing-mode: horizontal-tb;
    transform: rotate(180deg);
    background: var(--tie-deep);
    color: #fff;
    font-family: var(--font-body);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0;
    padding: 2px 5px;
    border-radius: 6px;
  }
  .road-content-grid {
    flex: 1;
    overflow: auto;
    padding: 4px;
    display: flex;
    align-items: flex-start;
  }

  /* ============================================
     GRID TABLES
     ============================================ */
  table.road-grid-table {
    border-collapse: collapse;
    border-spacing: 0;
    background: transparent;
    table-layout: fixed;
  }
  table.road-grid-table td {
    width: 19px;
    height: 19px;
    min-width: 19px;
    min-height: 19px;
    padding: 0;
    margin: 0;
    border: 0;
    background: transparent;
    position: relative;
    vertical-align: middle;
    text-align: center;
    line-height: 0;
    font-size: 0;
  }

  /* BIG ROAD — clay beads */
  td.br-b::after, td.br-p::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    border-radius: 50%;
  }
  td.br-b::after {
    background: linear-gradient(155deg, #E08268, var(--banker-deep));
    box-shadow: 2px 2px 4px rgba(174,79,53,0.5), -1px -1px 2px rgba(255,225,213,0.7);
  }
  td.br-p::after {
    background: linear-gradient(155deg, #7396C9, var(--player-deep));
    box-shadow: 2px 2px 4px rgba(62,92,138,0.5), -1px -1px 2px rgba(213,227,246,0.7);
  }
  td.br-tie::before {
    content: '';
    position: absolute;
    inset: 3px;
    background: linear-gradient(to bottom right,
      transparent 44%, var(--tie) 44%, var(--tie) 56%, transparent 56%);
    border-radius: 2px;
    z-index: 2;
  }
  .tie-count {
    position: absolute;
    top: -3px; right: -1px;
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    background: var(--tie-deep);
    border-radius: 50%;
    width: 12px; height: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    z-index: 3;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.25);
  }

  /* BIG EYE BOY */
  td.beb-r::after, td.beb-bl::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-radius: 50%;
  }
  td.beb-r::after { background: linear-gradient(155deg, #E08268, var(--banker-deep)); box-shadow: 1px 1px 3px rgba(174,79,53,0.5); }
  td.beb-bl::after { background: linear-gradient(155deg, #7396C9, var(--player-deep)); box-shadow: 1px 1px 3px rgba(62,92,138,0.5); }

  /* SMALL ROAD */
  td.sr-r::after, td.sr-bl::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border-radius: 50%;
  }
  td.sr-r::after { background: linear-gradient(155deg, #E08268, var(--banker-deep)); box-shadow: 1px 1px 3px rgba(174,79,53,0.55); }
  td.sr-bl::after { background: linear-gradient(155deg, #7396C9, var(--player-deep)); box-shadow: 1px 1px 3px rgba(62,92,138,0.55); }

  /* COCKROACH */
  td.cr-r::after, td.cr-bl::after {
    content: '';
    position: absolute;
    top: 50%; left: 2px; right: 2px;
    height: 3px;
    border-radius: 2px;
    transform: rotate(-45deg);
    transform-origin: center;
  }
  td.cr-r::after { background: var(--banker-deep); box-shadow: 1px 1px 2px rgba(174,79,53,0.5); }
  td.cr-bl::after { background: var(--player-deep); box-shadow: 1px 1px 2px rgba(62,92,138,0.5); }

  /* DISH ROAD */
  td.dish-r::after, td.dish-p::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    border-radius: 50%;
  }
  td.dish-r::after { background: linear-gradient(155deg, #E08268, var(--banker-deep)); box-shadow: 1px 1px 3px rgba(174,79,53,0.55); }
  td.dish-p::after { background: linear-gradient(155deg, #7396C9, var(--player-deep)); box-shadow: 1px 1px 3px rgba(62,92,138,0.55); }
  td.dish-t::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border-radius: 50%;
    background: linear-gradient(155deg, #5FA582, var(--tie-deep));
    box-shadow: 1px 1px 3px rgba(53,113,85,0.55);
  }

  /* ============================================
     SCROLLBAR
     ============================================ */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--gold-soft); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* ============================================
     FOCUS VISIBILITY
     ============================================ */
  button:focus-visible, .btn:focus-visible, .btnSm:focus-visible {
    outline: 3px solid var(--gold-deep);
    outline-offset: 2px;
  }

  /* ============================================
     RESPONSIVE
     ============================================ */
  @media (max-width: 720px) {
    .app { padding: 14px; }
    h1 { font-size: 24px; }
    .prediction { font-size: 42px; }
    .roads-grid-ref { grid-template-columns: 1fr; }
    .btn { padding: 14px 22px; font-size: 17px; }
  }
</style>
</head>
<body>
<!-- Animated gradient orbs -->
<div class="clay-blob b1"></div>
<div class="clay-blob b2"></div>
<div class="clay-blob b3"></div>

<div class="app">
  <!-- HEADER -->
  <div class="glass header-panel">
    <h1>🎴 Baccarat Live Predictor</h1>
    <p class="subtitle">Claymorphism UI — B = đỏ đất nung · P = xanh dương đất sét · T = xanh lá</p>
    <div class="settings-row">
      <label>Ngưỡng confidence (%):</label>
      <input type="number" id="confThreshold" class="glass-input" value="0" min="0" max="100" step="5">
      <span class="subtitle" style="margin:0;">0 = luôn hiển thị</span>
    </div>
    <div class="hotkeys">
      Phím tắt: <kbd>X</kbd> = B &nbsp; <kbd>Z</kbd> = P &nbsp; <kbd>C</kbd> = T &nbsp; <kbd>Backspace</kbd> = Undo
    </div>
  </div>

  <!-- INPUT ROW -->
  <div class="glass input-panel">
    <button class="btn btnB" onclick="addResult('B')">B <span class="key">[X]</span></button>
    <button class="btn btnP" onclick="addResult('P')">P <span class="key">[Z]</span></button>
    <button class="btn btnT" onclick="addResult('T')">T <span class="key">[C]</span></button>
    <button class="btnSm" onclick="undo()">↶ Undo</button>
    <button class="btnSm" id="resetBtn" onclick="resetAll()">🗑 Reset shoe</button>
  </div>

  <!-- TOOLBAR -->
  <div class="glass toolbar">
    <span class="subtitle" style="margin:0 6px 0 0;">Dữ liệu:</span>
    <button class="btnSm" onclick="exportCSV()">📥 Export CSV</button>
  </div>

  <!-- HISTORY -->
  <div class="glass history" id="historyBox">
    <span class="subtitle" style="margin:0;">Chưa có ván nào. Bấm B / P / T để bắt đầu.</span>
  </div>

  <!-- OUTPUT -->
  <div id="output"></div>
</div>

<script>
/* ============================================================
   STATE
   ============================================================ */
let history = [];
let predictions = [];
let lastRenderedPrediction = null;
let lastChipCount = 0;
const STRATEGY_NAMES = [
  "Dragon", "Ping Pong", "Double 2-2", "1-2-1",
  "Markov 1", "Markov 2", "Markov 3",
  "Big Road", "Big Eye Boy", "Small Road", "Cockroach",
];
const defaultWeights = Object.fromEntries(STRATEGY_NAMES.map(n => [n, 1]));
let weights = { ...defaultWeights };

/* ============================================================
   STRATEGIES
   ============================================================ */
function stratDragon(h) {
  if (h.length < 3) return null;
  const last = h[h.length - 1];
  if (last === "T") return null;
  let c = 0;
  for (let i = h.length - 1; i >= 0; i--) { if (h[i] === last) c++; else break; }
  return c >= 3 ? last : null;
}
function stratPingPong(h) {
  const f = h.filter(x => x !== "T");
  if (f.length < 4) return null;
  const a = f.slice(-4);
  if (a[0] !== a[2] || a[1] !== a[3] || a[0] === a[1]) return null;
  return a[3] === "B" ? "P" : "B";
}
function stratDouble(h) {
  const f = h.filter(x => x !== "T");
  if (f.length < 4) return null;
  const a = f.slice(-4);
  if (a[0] === a[1] && a[2] === a[3] && a[0] !== a[2]) return a[0];
  return null;
}
function strat121(h) {
  const f = h.filter(x => x !== "T");
  if (f.length < 3) return null;
  const a = f.slice(-3);
  if (a[0] !== a[1] && a[1] === a[2]) return a[0];
  return null;
}
function stratMarkov(h, k) {
  const f = h.filter(x => x !== "T");
  if (f.length < k + 5) return null;
  const ctx = f.slice(-k).join("");
  let b = 0, p = 0;
  for (let i = 0; i <= f.length - k - 1; i++) {
    if (f.slice(i, i + k).join("") === ctx) {
      if (f[i + k] === "B") b++; else if (f[i + k] === "P") p++;
    }
  }
  const total = b + p;
  if (total < (k === 1 ? 5 : k === 2 ? 3 : 2)) return null;
  if (b > p) return "B";
  if (p > b) return "P";
  return null;
}
function stratBigRoad(h) {
  const f = h.filter(x => x !== "T");
  if (f.length < 6) return null;
  const cols = []; let cur = 1;
  for (let i = 1; i < f.length; i++) {
    if (f[i] === f[i - 1]) cur++; else { cols.push(cur); cur = 1; }
  }
  cols.push(cur);
  if (cols.length < 3) return null;
  const last = cols[cols.length - 1], prev = cols[cols.length - 2], side = f[f.length - 1];
  if (last >= 3) return side;
  if (last < prev) return side === "B" ? "P" : "B";
  return null;
}
function stratDerived(h, offset) {
  const f = h.filter(x => x !== "T");
  if (f.length < offset + 6) return null;
  const cols = []; let cur = 1;
  for (let i = 1; i < f.length; i++) {
    if (f[i] === f[i - 1]) cur++; else { cols.push(cur); cur = 1; }
  }
  cols.push(cur);
  if (cols.length < offset + 2) return null;
  const last = cols[cols.length - 1];
  const ref  = cols[cols.length - 1 - offset];
  const side = f[f.length - 1];
  if (last < 2) return null;
  if (ref >= last) return side;
  if (last >= ref + 2) return side;
  return side === "B" ? "P" : "B";
}
function computeAllSignals(h) {
  return {
    "Dragon": stratDragon(h),
    "Ping Pong": stratPingPong(h),
    "Double 2-2": stratDouble(h),
    "1-2-1": strat121(h),
    "Markov 1": stratMarkov(h, 1),
    "Markov 2": stratMarkov(h, 2),
    "Markov 3": stratMarkov(h, 3),
    "Big Road": stratBigRoad(h),
    "Big Eye Boy": stratDerived(h, 1),
    "Small Road": stratDerived(h, 2),
    "Cockroach": stratDerived(h, 3),
  };
}
function computePrediction(h) {
  const signals = computeAllSignals(h);
  let wB = 0, wP = 0;
  const rows = STRATEGY_NAMES.map(name => {
    const sig = signals[name];
    const w = weights[name] || 1;
    if (sig === "B") wB += w; else if (sig === "P") wP += w;
    return { name, sig, w };
  });
  let pred = null;
  if (wB > wP) pred = "B"; else if (wP > wB) pred = "P";
  const totalW = wB + wP;
  const conf = totalW > 0 ? Math.round(Math.max(wB, wP) / totalW * 100) : 0;
  return { pred, conf, wB, wP, rows, signals };
}

/* ============================================================
   BUILD ROADS
   ============================================================ */
// Số hàng chuẩn của mỗi cột trước khi rẽ "đuôi rồng" sang phải (bảng thật dùng 6)
const ROAD_MAX_ROWS = 6;

// Big Road: gom các ván B/P liên tiếp cùng bên thành 1 "cột logic".
// Ván Hòa không tạo cột mới — nó được đè lên ván gần nhất (ties đếm được số hòa liên tiếp).
// Nếu Hòa xảy ra trước khi có ván B/P nào, tính vào leadingTies (hiện ở ô đầu bảng).
function buildBigRoad(h) {
  const cols = []; let cur = null; let leadingTies = 0;
  for (const r of h) {
    if (r === "T") {
      if (cur) cur.ties.push(cur.length - 1);
      else leadingTies++;
      continue;
    }
    if (!cur || cur.side !== r) { cur = { side: r, length: 1, ties: [] }; cols.push(cur); }
    else cur.length++;
  }
  cols.leadingTies = leadingTies;
  return cols;
}

// Quy đổi các cột logic sang toạ độ hiển thị (c, r), xử lý "đuôi rồng":
// khi 1 cột chạy quá ROAD_MAX_ROWS hàng, phần dư rẽ ngang sang phải theo hàng cuối.
function layoutColumns(cols, maxRows) {
  const cells = [];
  let visualCol = 0;
  for (const col of cols) {
    for (let i = 0; i < col.length; i++) {
      let c, r;
      if (i < maxRows) { r = i; c = visualCol; }
      else { r = maxRows - 1; c = visualCol + (i - maxRows + 1); }
      const tieCount = col.ties ? col.ties.filter(t => t === i).length : 0;
      cells.push({ c, r, side: col.side, tieCount });
    }
    visualCol += col.length <= maxRows ? 1 : 1 + (col.length - maxRows);
  }
  return { cells, totalCols: visualCol };
}

// Big Eye Boy / Small Road / Cockroach đều tính theo đúng 2 trường hợp:
// (1) ván mới TẠO CỘT MỚI trên Big Road → so sánh độ dài cột vừa xong với cột
//     cách "offset" cột bên trái nó: bằng nhau = Đỏ, lệch nhau = Xanh.
// (2) ván mới ĐI TIẾP trong CÙNG cột → xem ô cách "offset" cột bên trái, cùng hàng:
//     có ô đó (dù đỏ hay xanh) = Đỏ, ô trống = Xanh.
function buildDerivedSignal(bigCols, offset) {
  const seq = [];
  for (let c = 0; c < bigCols.length; c++) {
    const colLen = bigCols[c].length;
    for (let r = 0; r < colLen; r++) {
      let value = null;
      if (r === 0) {
        const justFinishedIdx = c - 1;
        const refIdx = c - 1 - offset;
        if (justFinishedIdx >= 0 && refIdx >= 0) {
          value = bigCols[justFinishedIdx].length === bigCols[refIdx].length;
        }
      } else {
        const refIdx = c - offset;
        if (refIdx >= 0) value = bigCols[refIdx].length > r;
      }
      if (value !== null) seq.push(value); // true = Đỏ (đều đặn), false = Xanh (bất thường)
    }
  }
  return seq;
}

// Gom chuỗi Đỏ/Xanh thành các "cột" y hệt cách vẽ Big Road (chuỗi cùng màu đi dọc,
// đổi màu thì sang cột mới) — để 3 đường phái sinh cũng có đuôi rồng như thật.
function groupSignalIntoColumns(seq) {
  const cols = []; let cur = null;
  for (const v of seq) {
    if (!cur || cur.side !== v) { cur = { side: v, length: 1, ties: [] }; cols.push(cur); }
    else cur.length++;
  }
  return cols;
}

/* ============================================================
   RENDER GRID TABLES
   ============================================================ */
const MIN_COLS = { bigroad: 24, beb: 20, sr: 18, cr: 18, dish: 6 };

function renderGridFromCells(cells, totalCols, maxRows, minCols, cellFor) {
  const cols = Math.max(totalCols, minCols);
  const grid = {};
  for (const cell of cells) grid[`${cell.c},${cell.r}`] = cell;
  let html = '<table class="road-grid-table"><tbody>';
  for (let r = 0; r < maxRows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) html += cellFor(grid[`${c},${r}`]);
    html += '</tr>';
  }
  return html + '</tbody></table>';
}

function renderBigRoadGrid(bigCols) {
  const { cells, totalCols } = layoutColumns(bigCols, ROAD_MAX_ROWS);
  return renderGridFromCells(cells, totalCols, ROAD_MAX_ROWS, MIN_COLS.bigroad, (cell) => {
    if (!cell) return '<td></td>';
    let cls = cell.side === 'B' ? 'br-b' : 'br-p';
    if (cell.tieCount > 0) cls += ' br-tie';
    const label = cell.tieCount > 1 ? `<span class="tie-count">${cell.tieCount}</span>` : '';
    return `<td class="${cls}">${label}</td>`;
  });
}

function renderDerivedGrid(bigCols, offset, minCols, prefix) {
  const seq = buildDerivedSignal(bigCols, offset);
  const cols = groupSignalIntoColumns(seq);
  const { cells, totalCols } = layoutColumns(cols, ROAD_MAX_ROWS);
  return renderGridFromCells(cells, totalCols, ROAD_MAX_ROWS, minCols, (cell) => {
    if (!cell) return '<td></td>';
    return `<td class="${cell.side ? `${prefix}-r` : `${prefix}-bl`}"></td>`;
  });
}

// Bead Plate / Bảng Hạt: ghi TẤT CẢ kết quả theo thứ tự, kể cả Hòa (chấm xanh lá riêng),
// đầy 6 ô thì sang cột kế tiếp. Lưu ý: app chưa lưu dữ liệu Đôi (Pair) nên chưa vẽ chấm Đôi phụ.
function renderDishGrid(h) {
  const rowsPerCol = 6;
  const totalCols = Math.max(Math.ceil(h.length / rowsPerCol), MIN_COLS.dish);
  let html = '<table class="road-grid-table"><tbody>';
  for (let r = 0; r < rowsPerCol; r++) {
    html += '<tr>';
    for (let c = 0; c < totalCols; c++) {
      const idx = c * rowsPerCol + r;
      let cls = '';
      if (idx < h.length) {
        const v = h[idx];
        cls = v === 'B' ? 'dish-r' : v === 'P' ? 'dish-p' : 'dish-t';
      }
      html += `<td class="${cls}"></td>`;
    }
    html += '</tr>';
  }
  return html + '</tbody></table>';
}

/* ============================================================
   ACTIONS
   ============================================================ */
function addResult(r) {
  try {
    if (typeof gsap !== "undefined") {
      const btnId = r === "B" ? ".btnB" : r === "P" ? ".btnP" : ".btnT";
      const btn = document.querySelector(btnId);
      if (btn) gsap.fromTo(btn, { scale: 1 }, { scale: 0.9, duration: 0.08, yoyo: true, repeat: 1 });
    }
    if (predictions.length > 0) {
      const lastPred = predictions[predictions.length - 1];
      if (lastPred.actual === null) {
        lastPred.actual = r;
        if (lastPred.pred === null) lastPred.correct = null;
        else lastPred.correct = (lastPred.pred === r);
        if (lastPred.stratCorrect) {
          for (const name of STRATEGY_NAMES) {
            const sig = lastPred.stratSignals ? lastPred.stratSignals[name] : null;
            if (sig === null || sig === undefined) lastPred.stratCorrect[name] = null;
            else if (r === "T") lastPred.stratCorrect[name] = null;
            else lastPred.stratCorrect[name] = (sig === r);
          }
        }
      }
    }
    history.push(r);
    render();
  } catch (e) { console.error(e); }
}
function undo() {
  try {
    if (!history.length) return;
    const removed = history.pop();
    if (predictions.length > 0) {
      const lastPred = predictions[predictions.length - 1];
      if (lastPred.actual === removed) {
        lastPred.actual = null;
        lastPred.correct = null;
        if (lastPred.stratCorrect) for (const name of STRATEGY_NAMES) lastPred.stratCorrect[name] = null;
      }
    }
    lastChipCount = Math.min(lastChipCount, history.length);
    render();
  } catch (e) { console.error(e); }
}
function markManual(correct) {
  if (!predictions.length) return;
  const lastPred = predictions[predictions.length - 1];
  if (lastPred.actual !== null && lastPred.correct === null) {
    lastPred.correct = correct;
    render();
  }
}
let resetArmed = false, resetTimer = null;
function resetAll() {
  const btn = document.getElementById("resetBtn");
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = "⚠️ Bấm lần nữa để xóa";
    btn.classList.add("btnWarn");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      resetArmed = false;
      btn.textContent = "🗑 Reset shoe";
      btn.classList.remove("btnWarn");
    }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  btn.textContent = "🗑 Reset shoe";
  btn.classList.remove("btnWarn");
  history = []; predictions = [];
  lastRenderedPrediction = null; lastChipCount = 0;
  render();
}
function setWeight(name, val) { weights[name] = Math.max(0, parseInt(val) || 0); render(); }

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (k === "x") { addResult("B"); e.preventDefault(); }
  else if (k === "z") { addResult("P"); e.preventDefault(); }
  else if (k === "c") { addResult("T"); e.preventDefault(); }
  else if (e.key === "Backspace") { undo(); e.preventDefault(); }
});

/* ============================================================
   CSV
   ============================================================ */
function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (s.includes(",") || s.includes('"') || s.includes("\n")) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function buildCSV(pl, hl) {
  const header = ["index", "actual", "prediction", "confidence", "voting_correct", "wB", "wP", ...STRATEGY_NAMES.map(n => `sig_${n}`), ...STRATEGY_NAMES.map(n => `ok_${n}`)];
  const rows = [header.join(",")];
  for (let i = 0; i < hl.length; i++) {
    const actual = hl[i];
    const p = pl.find(pr => pr.index === i);
    if (!p) { rows.push([i, actual, "", "", "", "", "", ...STRATEGY_NAMES.map(() => ""), ...STRATEGY_NAMES.map(() => "")].map(csvEscape).join(",")); continue; }
    const line = [i, actual, p.pred || "", p.conf ?? "", p.correct === true ? "1" : p.correct === false ? "0" : "", p.wB ?? "", p.wP ?? "", ...STRATEGY_NAMES.map(n => (p.stratSignals && p.stratSignals[n]) || ""), ...STRATEGY_NAMES.map(n => { if (!p.stratCorrect) return ""; const v = p.stratCorrect[n]; return v === true ? "1" : v === false ? "0" : ""; })];
    rows.push(line.map(csvEscape).join(","));
  }
  return rows.join("\n");
}
function downloadCSV(content, filename) {
  try {
    const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {}
}
function exportCSV() {
  if (!history.length) { alert("Chưa có dữ liệu."); return; }
  const csv = buildCSV(predictions, history);
  const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  downloadCSV(csv, `baccarat_${ts}.csv`);
}

/* ============================================================
   STATS
   ============================================================ */
function computeStrategyStats(allPredictions) {
  const stats = {};
  for (const name of STRATEGY_NAMES) stats[name] = { signals: 0, correct: 0, wrong: 0, skipped: 0 };
  for (const p of allPredictions) {
    if (p.actual === null || p.actual === "T") continue;
    if (!p.stratSignals) continue;
    for (const name of STRATEGY_NAMES) {
      const sig = p.stratSignals[name];
      if (sig === null || sig === undefined) { stats[name].skipped++; continue; }
      stats[name].signals++;
      const ok = p.stratCorrect ? p.stratCorrect[name] : null;
      if (ok === true) stats[name].correct++; else if (ok === false) stats[name].wrong++;
    }
  }
  return stats;
}
function renderStrategyPerf(stats) {
  const rows = STRATEGY_NAMES.map(name => {
    const s = stats[name];
    const scored = s.correct + s.wrong;
    const hr = scored > 0 ? Math.round(s.correct / scored * 100) : 0;
    const barW = scored > 0 ? Math.round(hr * 0.6) : 0;
    return `<tr><td>${name}</td><td class="num">${s.signals}</td><td class="num" style="color:#4ade80">${s.correct}</td><td class="num" style="color:#f87171">${s.wrong}</td><td class="num">${scored > 0 ? hr + "%" : "—"}</td><td><span class="hr-bar" style="width:${barW}px"></span></td></tr>`;
  }).join("");
  return `<table class="perf"><thead><tr><th>Strategy</th><th class="num">Signal</th><th class="num">Đúng</th><th class="num">Sai</th><th class="num">Hit rate</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
function animateChips() {
  if (typeof gsap === "undefined") return;
  const chips = document.querySelectorAll(".h-chip");
  for (let i = lastChipCount; i < chips.length; i++) {
    gsap.from(chips[i], { y: -20, scale: 0.4, opacity: 0, duration: 0.4, ease: "back.out(2)" });
  }
  lastChipCount = chips.length;
}
function animatePrediction() {
  if (typeof gsap === "undefined") return;
  const el = document.querySelector(".prediction");
  if (!el) return;
  gsap.fromTo(el, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.6)" });
}
function animateStats() {
  if (typeof gsap === "undefined") return;
  document.querySelectorAll(".stat-card .value").forEach(el => {
    const target = parseInt(el.dataset.target || el.textContent) || 0;
    const obj = { val: 0 };
    gsap.to(obj, { val: target, duration: 0.8, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(obj.val) + (el.dataset.suffix || ""); } });
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  try { renderInner(); } catch (e) {
    console.error(e);
    const out = document.getElementById("output");
    if (out) out.innerHTML = `<div class="glass result"><p style="color:#fbbf24;font-weight:bold;">⚠️ Lỗi render</p><p class="subtitle">${e.message}</p></div>`;
  }
}
function renderInner() {
  const hBox = document.getElementById("historyBox");
  if (!history.length) {
    hBox.innerHTML = '<span class="subtitle" style="margin:0;">Chưa có ván nào. Bấm B / P / T để bắt đầu.</span>';
    lastChipCount = 0;
  } else {
    hBox.innerHTML = history.map((r, i) => {
      let cls = "";
      const p = predictions.find(pr => pr.index === i);
      if (p && p.correct === true) cls = "mark-ok";
      else if (p && p.correct === false) cls = "mark-no";
      return `<span class="h-chip h-${r} ${cls}">${r}</span>`;
    }).join("");
  }
  const out = document.getElementById("output");

  const bigCols = buildBigRoad(history);

  const roadsHtml = `
    <div class="glass roads-panel">
      <div class="roads-grid-ref">
        <div class="road-panel">
          <div class="road-label-v">Big Road${bigCols.leadingTies ? `<span class="leading-tie-badge" title="${bigCols.leadingTies} ván Hòa trước ván B/P đầu tiên">T×${bigCols.leadingTies}</span>` : ''}</div>
          <div class="road-content-grid">${renderBigRoadGrid(bigCols)}</div>
        </div>
        <div class="road-panel">
          <div class="road-label-v">Big Eye Boy</div>
          <div class="road-content-grid">${renderDerivedGrid(bigCols, 1, MIN_COLS.beb, 'beb')}</div>
        </div>
        <div class="road-panel">
          <div class="road-label-v">Small Road</div>
          <div class="road-content-grid">${renderDerivedGrid(bigCols, 2, MIN_COLS.sr, 'sr')}</div>
        </div>
        <div class="road-panel">
          <div class="road-label-v">Cockroach</div>
          <div class="road-content-grid">${renderDerivedGrid(bigCols, 3, MIN_COLS.cr, 'cr')}</div>
        </div>
        <div class="road-panel">
          <div class="road-label-v">Bead Plate</div>
          <div class="road-content-grid">${renderDishGrid(history)}</div>
        </div>
        <div class="road-panel empty"></div>
      </div>
    </div>`;

  if (history.length < 3) {
    out.innerHTML = `<div class="glass result"><p class="subtitle" style="text-align:center;">Cần ít nhất 3 ván để dự đoán. Đã có ${history.length}.</p></div>${roadsHtml}`;
    animateChips();
    return;
  }

  const { pred, conf, wB, wP, rows, signals } = computePrediction(history);
  const threshold = parseInt(document.getElementById("confThreshold").value) || 0;
  const currentIndex = history.length;
  let lastPred = predictions[predictions.length - 1];
  if (!lastPred || lastPred.index !== currentIndex) {
    predictions.push({ index: currentIndex, pred, conf, wB, wP, actual: null, correct: null, stratSignals: { ...signals }, stratCorrect: Object.fromEntries(STRATEGY_NAMES.map(n => [n, null])) });
    lastPred = predictions[predictions.length - 1];
  } else {
    lastPred.pred = pred; lastPred.conf = conf; lastPred.wB = wB; lastPred.wP = wP; lastPred.stratSignals = { ...signals };
  }
  const showPrediction = conf >= threshold && pred !== null;
  const cls = !showPrediction ? "N" : pred === "B" ? "B" : "P";
  const predText = !showPrediction ? "NO SIGNAL" : pred === "B" ? "BANKER" : "PLAYER";
  const gateMsg = (pred !== null && conf < threshold) ? `Confidence ${conf}% < ngưỡng ${threshold}%` : "";
  const strategyRows = rows.map(({ name, sig, w }) => `<tr><td>${name}</td><td class="${sig || 'N'}">${sig || "NO SIGNAL"}</td><td><input class="w-input" type="number" min="0" value="${w}" onchange="setWeight('${name}', this.value)"></td></tr>`).join("");
  const totalPred = predictions.filter(p => p.pred !== null).length;
  const totalCorrect = predictions.filter(p => p.correct === true).length;
  const totalWrong = predictions.filter(p => p.correct === false).length;
  const totalScored = totalCorrect + totalWrong;
  const hitRate = totalScored > 0 ? Math.round(totalCorrect / totalScored * 100) : 0;
  const coverage = predictions.length > 0 ? Math.round(totalPred / predictions.length * 100) : 0;
  const canManual = lastPred.actual !== null && lastPred.correct === null;
  const feedbackHtml = canManual ? `<div class="feedback-row"><button class="btnOk" onclick="markManual(true)">✔ Đúng</button><button class="btnNo" onclick="markManual(false)">✘ Sai</button></div>` : "";
  const stratStats = computeStrategyStats(predictions);

  out.innerHTML = `
    <div class="glass result">
      <div class="prediction ${cls}">${predText}</div>
      <div class="conf">Weighted votes: B = ${wB} | P = ${wP} | Confidence: ${conf}%</div>
      ${gateMsg ? `<div class="gate">${gateMsg}</div>` : ""}
      <h2>📊 Chiến thuật</h2>
      <table class="strat"><tr><th>Strategy</th><th>Tín hiệu</th><th>Trọng số</th></tr>${strategyRows}</table>
      <h2>📈 Hiệu suất Voting</h2>
      <div class="stats">
        <div class="stat-card"><div class="label">TỔNG PREDICTION</div><div class="value" data-target="${totalPred}">0</div><div class="sub">Coverage: ${coverage}%</div></div>
        <div class="stat-card"><div class="label">ĐÚNG</div><div class="value" style="color:#4ade80" data-target="${totalCorrect}">0</div></div>
        <div class="stat-card"><div class="label">SAI</div><div class="value" style="color:#f87171" data-target="${totalWrong}">0</div></div>
        <div class="stat-card"><div class="label">HIT RATE</div><div class="value" data-target="${hitRate}" data-suffix="%">0%</div><div class="sub">trên ${totalScored} prediction đã chấm</div></div>
      </div>
      ${feedbackHtml}
      <h2>🎯 Hiệu suất từng strategy</h2>
      ${renderStrategyPerf(stratStats)}
      <p class="subtitle" style="margin-top:16px;text-align:center;">⚠️ Hit rate thực tế thường quanh 50%. Không đảm bảo thắng.</p>
    </div>
    ${roadsHtml}`;
  animateChips();
  animateStats();
  if (predText !== lastRenderedPrediction) { animatePrediction(); lastRenderedPrediction = predText; }
}
try { render(); } catch (e) { console.error(e); }
</script>
</body>
</html>
